name: CI
on:
  push:
    tags:
      - "v*"
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
jobs:
  ash-ci:
    uses: ash-project/ash/.github/workflows/ash-ci.yml@main
    # The union of what the reusable workflow's jobs ask for. A called workflow can
    # only narrow what the caller grants.
    permissions:
      contents: write
      security-events: write
      pages: write
      id-token: write
    with:
      # The suite runs against Postgres: the chain is a trigger.
      postgres: true
      postgres-version: "16"
      # The test repo's migrations are generated by AshPostgres, so the workflow's
      # `ash_postgres.generate_migrations --check` gate applies.
      ash_postgres: true
      # Multitenancy here is attribute-based; there are no tenant schemas.
      tenants: false
      # No web surface for sobelow to scan.
      sobelow: false
      # CHANGELOG.md keeps a hand-written Unreleased section until a first release.
      changelog-lint: false
      reuse: true
    secrets:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
